<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Success - Team Ikon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #000000; color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #000000; padding: 20px; border-bottom: 2px solid #ffcc00; }
        header h1 { color: #ffcc00; font-size: 1.5rem; }
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; }
        .box { width: 320px; padding: 30px; background-color: #111111; border: 1px solid #333333; border-radius: 6px; text-align: center; }
        .box h2 { color: #ffcc00; margin-bottom: 15px; }
        .box p { color: #cccccc; margin-bottom: 20px; }
        .btn-logout { display: block; width: 100%; padding: 10px; background-color: #ffcc00; color: #000000; font-weight: bold; text-decoration: none; border-radius: 4px; text-align: center; }
        .btn-logout:hover { background-color: #e6b800; }
        footer { background-color: #000000; text-align: center; padding: 15px; border-top: 1px solid #333333; color: #888888; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <h1>IkonCyberDeveloper</h1>
    </header>

    <div class="main-content">
        <div class="box">
            <h2>Login Successful!</h2>
            <p>Welcome to the dashboard.</p>
            <a href="/login" class="btn-logout">Logout</a>
        </div>
    </div>

    <footer>
        <p>This is developed by team Ikon</p>
    </footer>

</body>
</html>
